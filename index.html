<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2230">
<title>Zeitenwacht</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2230'/%3E%3Cpath d='M10 6h12v3c0 4-4 5-4 7s4 3 4 7v3H10v-3c0-4 4-5 4-7s-4-3-4-7z' fill='none' stroke='%23f2c14e' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M13 23c1-2 2-2 3-3 1 1 2 1 3 3z' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/ui.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<canvas id="scene" aria-label="Spielfeld"></canvas>
<div id="ui"></div>
<div id="boot" role="status">
  <div class="boot-card">
    <div class="boot-title">Zeitenwacht</div>
    <div class="boot-text" id="boot-text">Die Insel wird aufgebaut …</div>
  </div>
</div>
<script>
  // Läuft auch dann, wenn die Module nicht geladen werden können, und erklärt in diesem Fall, was zu tun ist.
  (function () {
    var text = document.getElementById('boot-text');
    function fail(message) {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('boot-error');
      text.innerHTML = message;
    }
    window.__bootFail = fail;
    if (location.protocol === 'file:' && document.querySelector('script[type="importmap"]')) {
      fail('Das Spiel lässt sich nicht direkt als Datei öffnen, weil Browser Module nur über einen Webserver laden.<br><br>Starte es so: im Projektordner <code>./start.sh</code> ausführen (oder <code>python3 tools/serve.py --open</code>).<br>Alternativ die fertige Einzeldatei <code>dist/zeitenwacht.html</code> per Doppelklick öffnen.');
      return;
    }
    window.addEventListener('error', function (event) {
      if (window.__ready) return;
      fail('Beim Start ist ein Fehler aufgetreten:<br><code>' + String(event.message || event.error || 'unbekannt').replace(/</g, '&lt;') + '</code>');
    });
    window.addEventListener('unhandledrejection', function (event) {
      if (window.__ready) return;
      fail('Beim Start ist ein Fehler aufgetreten:<br><code>' + String(event.reason && event.reason.message || event.reason || 'unbekannt').replace(/</g, '&lt;') + '</code>');
    });
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
